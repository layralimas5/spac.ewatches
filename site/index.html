<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` libera as áreas seguras do iPhone para o CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Fontes da marca. `preconnect` primeiro para o handshake não atrasar o texto. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Título e descrição base: cada página sobrescreve com o componente Seo. -->
    <title>Space Watches | Relógios originais e importação personalizada</title>
    <meta
      name="description"
      content="Relógios importados originais, com caixa e documentos, e importação personalizada sob encomenda. Você escolhe o modelo, a Space Watches traz."
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; color: #0a0a0a; font-family: sans-serif">
        Este site precisa de JavaScript para funcionar. Ative o JavaScript no navegador ou fale com a
        gente pelo Instagram
        <a href="https://www.instagram.com/spac.ewatches/" style="color: #0a0a0a">@spac.ewatches</a>.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
